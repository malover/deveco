[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codetograph-mcp"
version = "1.0.0"
description = "MCP server for navigating and tracing codetograph code knowledge graphs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
codetograph-mcp = "codetograph_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
